default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: \.py$
      - id: ruff-format
        files: \.py$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        args: ["-shellcheck="]
        files: ^\.github/workflows/.*\.(yml|yaml)$

  - repo: local
    hooks:
      - id: ts-type-check
        name: TypeScript 类型检查
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: build-on-push
        name: Push 前构建校验
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

exclude: |
  (?x)^(
    node_modules/.*|
    dist/.*|
    assets/videos/.*|
    PROFILE
  )$
